<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات المتجر والإعلانات - أثير ستور</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">⚙️ إعدادات <span>المتجر والإعلانات</span></div>
        <div style="display: flex; gap: 10px;">
            <a href="admin.html" class="btn btn-save" style="text-decoration: none; padding: 6px 14px; font-size: 0.85rem;">📦 إدارة المنتجات</a>
            <a href="index.html" class="btn btn-cancel" style="text-decoration: none; padding: 6px 14px; font-size: 0.85rem;">عرض المتجر 🌐</a>
        </div>
    </header>

    <main class="container">
        <section class="admin-section" style="margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto;">
            <h2>⚙️ لوحة التحكم في الإعدادات العامة</h2>
            <form id="settings-form" onsubmit="saveSettings(event)">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>نص شريط الإعلانات المتحرك:</label>
                    <input type="text" id="setting-marquee" placeholder="اكتب نص الإعلان المتحرك هنا..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>رقم الواتساب لتلقي الطلبات (بدون +، مع المفتاح الدولي):</label>
                    <input type="text" id="setting-phone" placeholder="مثال: 966500000000" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label>تفاصيل الحساب البنكي / طرق الدفع:</label>
                    <input type="text" id="setting-bank" placeholder="مثال: البنك الأهلي: 123456789 - اسم المستفيد: فلان" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;" required>
                </div>

                <button type="submit" class="btn btn-save" style="width: 100%; cursor: pointer; padding: 12px;">حفظ التعديلات العامة</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
