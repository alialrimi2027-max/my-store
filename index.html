<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الصديق - المتجر الرقمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر / الشريط العلوي (للعملاء فقط بدون لوحة تحكم) -->
    <header class="navbar">
        <div class="logo">⚡ متجر الصديق<span>الخاص</span></div>
    </header>

    <main class="container">
        
        <!-- قسم عرض المنتجات للزوار -->
        <section class="store-section">
            <h1 class="main-title">منتجاتنا والخدمات المتاحة</h1>
            <div id="products-grid" class="products-grid">
                <!-- يتم تحميل المنتجات هنا برمجياً -->
            </div>
        </section>

    </main>

    <!-- نافذة الطلب والدفع المباشر للعملاء -->
    <div id="buy-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-product-name">تفاصيل الطلب</h2>
            <p class="modal-price">المبلغ المطلوب: <strong id="modal-product-price">0</strong></p>
            
            <div class="bank-details">
                <h3>💳 طرق التحويل المتاحة:</h3>
                <p id="modal-bank-text">جاري تحميل بيانات الحساب...</p>
            </div>

            <p class="instructions">بعد إتمام التحويل، اضغط على الزر أدناه لإرسال الإيصال عبر الواتساب لإكمال طلبك.</p>
            
            <a id="whatsapp-link" href="#" target="_blank" class="btn btn-whatsapp">📱 إرسال الإيصال عبر الواتساب</a>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
